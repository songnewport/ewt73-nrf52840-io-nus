# E73 nRF52840 BLE NUS + JSS bring-up firmware.
# Aligned with Nordic official peripheral_uart sample patterns.

CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_TEMP_NRF5=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Keep physical UART/console quiet for module testing.
# (Official sample enables CONSOLE+UART_CONSOLE for UART bridge;
#  we disable them because E73 module has no debug UART routed.)
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
# FIX(问题prj): Align with official - don't route printk through log subsystem
CONFIG_LOG_PRINTK=n

# FIX(问题11): Heap pool required by BLE subsystem internals.
# Official peripheral_uart sets 2048.
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Bluetooth LE peripheral + Nordic UART Service.
CONFIG_BT=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Justin_Shunt_Test"
# Appearance 833 = 0x0341 = Generic Sensor (Bluetooth SIG assigned number)
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=2
CONFIG_BT_MAX_PAIRED=4
CONFIG_BT_NUS=y

# Enable bonding / settings persistence.
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_FLASH=y
# FIX(问题5): Add FLASH_PAGE_LAYOUT to match official sample.
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Usable NUS packet size without making the demo complicated.
CONFIG_BT_ATT_PREPARE_COUNT=2
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

# E73 modules are reliable with the internal RC LF clock
# (no external 32.768 kHz crystal populated).
CONFIG_CLOCK_CONTROL_NRF_K32SRC_RC=y
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=n

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
